import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

const firebaseConfig = {

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const DEFAULT_NAMES = ["陳冠宇","姜艾陵","曾文欽","陳淑鳳","呂桓毅","陳有德","范育誠","鄭子韋","康必達","邵玥秞","呂秀娟","林于修","王信淵","蘇素茹","李國珍","王嬿翔","洪國城","劉子榕","胡哲強","四海的曾姐","陳敏祥","張玉玲","馬靜","李冠璇","阿殷","龔裕琇","徐紹真","徐紹堂","施小呅","葉人渝"];

const DEFAULTS = [
  {text:"早起後不碰手機，先喝水",type:"text",locked:true},

  {text:"寫三句話日記",type:"text",locked:true},

];

let boardKey = localStorage.getItem('dashboard_key') || '';
let cache = {};
let currentDate = new Date();
let saveTimer = null;
// 🔴 dirtyToday：本機是否有「還沒寫進 Firestore」的變更。
//    沒有的話，即時同步就該直接採用伺服器版本；否則另一個還開著的分頁／手機
//    會拿手上的舊清單整份寫回去，把別人剛刪掉的項目復活（症狀：刪了又恢復）。
let dirtyToday = false;
let changeGen = 0;   // 本機變更序號：寫入完成時序號若沒變，才算真的乾淨
let nameList = [...DEFAULT_NAMES];
let editMode = false;
let careDates = {};
let careEvery = 1;
let careCount = 1;
let careInterval = 7;
let startDate = '';
// 全域項目範本 — 使用者新增/修改/刪除後自動同步，所有日期共用
let itemsTemplate = [];
// 主控板名稱 — 新開板的用戶會繼承這個板的範本作為起始內定
const MASTER_BOARD = 'alan';
const BOARD_DISPLAY = { 'alan': '養成好習慣' };  // 顯示名稱
const DISPLAY_TO_KEY = Object.assign(Object.fromEntries(Object.entries(BOARD_DISPLAY).map(([k, v]) => [v, k])), { '好習慣': 'alan' });  // 顯示名 → 板名
const EPOCH = new Date('2025-01-01');

function dk(d) { return d.toISOString().slice(0,10); }
function today() { return dk(new Date()); }

function makeDay(items) {
  return {
    items: items.map(i => typeof i === 'string' ? {text:i,type:"text",done:false,selected:"",notes:"",locked:true}
      : {...i, done: i.done || false, selected: i.selected || "", notes: i.notes || "", locked: i.locked !== false}),
    _names: nameList
  };
}

async function loadDoc() {
  try {
    const ref = doc(db, "dashboard", boardKey);
    const snap = await getDocFromServer(ref);
    return snap.exists() ? snap.data() : {};
  } catch(e) {
    console.warn('Load failed:', e);
    setStatus(false);
    return {};
  }
}

async function saveDoc(extra) {
  try {
    const ref = doc(db, "dashboard", boardKey);
    const data = await loadDoc();
    const names = nameList.length ? nameList : DEFAULT_NAMES;
    data._names = names;
    data._careEvery = careEvery;
    data._careCount = careCount;
    data._careInterval = careInterval;
    data._careDates = careDates;
    // Ensure _startDate is set — respect user-set value, only fallback to today if truly missing
    if (!data._startDate) {
      data._startDate = today();
      startDate = data._startDate;
    } else if (data._startDate === '2026-05-10') {
      // Stale value from earlier bug — set to today
      data._startDate = today();
      startDate = data._startDate;
    } else if (startDate && startDate !== data._startDate) {
      data._startDate = startDate;
    }
    if (extra) Object.assign(data, extra);
    await setDoc(ref, data);
    setStatus(true);
  } catch(e) {
    console.warn('Save failed:', e);
    setStatus(false);
  }
}

async function loadDay(key, dateStr) {
  const data = await loadDoc();
  nameList = data._names && data._names.length ? data._names : DEFAULT_NAMES;
  careEvery = data._careEvery || 1;
  careCount = data._careCount || 1;
  careInterval = data._careInterval || 7;
  careDates = data._careDates || {};
  startDate = data._startDate || today();
  // If startDate is the stale 2026-05-10, treat as unset
  if (startDate === '2026-05-10') startDate = today();
  const dayData = data[dateStr];
  // 載入全域範本
  if (data._itemsTemplate && data._itemsTemplate.length) {
    itemsTemplate = data._itemsTemplate.map(i => ({text:i.text,type:i.type||"text",locked:i.locked!==false}));
  } else if (boardKey !== MASTER_BOARD) {
    // 無自訂範本且非主控板 → 從主控板繼承
    await inheritMasterTemplate();
  }
  if (dayData && dayData.items) {
    let migrated = dayData.items.map(i => typeof i === 'string'
      ? {text:i,type:"text",done:false,selected:"",notes:"",locked:true}
      : {...i, done:i.done||false, selected:i.selected||"", notes:i.notes||"", locked:i.locked!==false});
    // 🔴 絕對不要用「索引」去比對 DEFAULTS：使用者刪掉/新增項目後清單長度就和 DEFAULTS 不同，
    //    按索引同步會把項目改名、改型別，甚至憑空長出項目（舊症狀：刪掉的東西重新整理又出現）
    //    改為：名稱題的標題固定用預設字；文字空白的項目給一個安全預設值，其餘一律尊重使用者資料
    const _npDef = DEFAULTS.find(i => i.type === 'name-picker');
    migrated.forEach(it => {
      if (it.type === 'name-picker' && _npDef) { it.text = _npDef.text; return; }
      if (!it.text || !String(it.text).trim()) it.text = '(未命名)';
    });
    cache[dateStr] = { items: migrated };
    // ✅ 確保 name-picker 項目永遠存在（即使 Firestore 沒有）
    if (!migrated.find(i => i.type === 'name-picker')) {
      const np = DEFAULTS.find(i => i.type === 'name-picker');
      if (np) cache[dateStr].items.push({...np, done:false, selected:'', notes:''});
    }
    // 🔴 原本這裡會把今天的 name-picker 強制清空 (selected='' / done=false)，
    //    使得每次載入都「有變動」→ 觸發一次存檔 → 剛開 App 就把手上的清單整份寫回 Firestore，
    //    正好蓋掉另一台裝置剛刪掉的項目（症狀：刪了又恢復）。
    //    輪替本來就會在 ensureTodayNamePickerSelected() 覆蓋 selected，這裡不需要再插一腳；
    //    「換人時把愛心清掉」也改到那裡，只在人真的換了才動作。
  } else {
    cache[dateStr] = { items: getTemplate().map(i => ({...i, done:false, selected:i.selected||"", notes:""})) };
    // ✅ 確保 name-picker 項目永遠存在
    if (!cache[dateStr].items.find(i => i.type === 'name-picker')) {
      const np = DEFAULTS.find(i => i.type === 'name-picker');
      if (np) cache[dateStr].items.push({...np, done:false, selected:'', notes:''});
    }
  }
  // Auto-fill today's name-picker based on daily rotation
  ensureTodayNamePickerSelected(dateStr);
  render();
}

async function saveCurrentDay() {
  const day = cache[dk(currentDate)];
  if (!day) return;
  const gen = changeGen;   // 這次要寫入的版本
  const ref = doc(db, "dashboard", boardKey);
  const update = {};
  update[dk(currentDate)] = { items: day.items.map(i => ({text:i.text,type:i.type,done:i.done,selected:i.selected||"",notes:i.notes||"",locked:i.locked!==false})) };
  update._nameList = nameList;
  update._careEvery = careEvery;
  update._careCount = careCount;
  update._careInterval = careInterval;
  update._careDates = careDates;
  // _startDate is set ONCE by saveDoc() in loadDay on first load — NOT here.
  // Omitting _startDate from saveCurrentDay prevents the 'always-overwrite' bug.
  try {
    await setDoc(ref, update, { merge: true });
    setStatus(true);
    if (gen === changeGen) dirtyToday = false;   // 寫入期間沒有新變更 → 本機已與伺服器一致
  } catch(e) { setStatus(false); }
}

function scheduleSave() {
  changeGen++;
  dirtyToday = true;
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saveTimer = null; saveCurrentDay(); }, 500);
}

// 不等 debounce，立刻寫入（刪除這種不可逆的操作必須馬上去）
function flushSave() {
  changeGen++;
  dirtyToday = true;
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
  return saveCurrentDay();
}

async function preloadRecent(key) {
  const data = await loadDoc();
  nameList = data._names && data._names.length ? data._names : DEFAULT_NAMES;
  careEvery = data._careEvery || 1;
  careCount = data._careCount || 1;
  careInterval = data._careInterval || 7;
  careDates = data._careDates || {};
  // 🔴 不可寫成 data._startDate || ''：loadDay 已經把「沒有 _startDate」補成今天，
  //    這裡若清成空字串，getCareSuggestions() 會算出 NaN → 對象變成 undefined，
  //    接著 ensureTodayNamePickerSelected() 會把 'undefined' 寫進今天的 name-picker。
  startDate = data._startDate || startDate || today();
  // 載入全域範本
  if (data._itemsTemplate && data._itemsTemplate.length) {
    itemsTemplate = data._itemsTemplate.map(i => ({text:i.text,type:i.type||"text",locked:i.locked!==false}));
  } else if (boardKey !== MASTER_BOARD) {
    // 無自訂範本且非主控板 → 從主控板繼承 (await 已在 loadDay 完成，此處 fire-and-forget)
    inheritMasterTemplate();
  }
  for (const [ds, dayData] of Object.entries(data)) {
    // Skip today — already loaded and migrated by loadDay
    if (ds === dk(currentDate)) continue;
    if (dayData && dayData.items) {
      cache[ds] = { items: dayData.items.map(i => typeof i === 'string'
        ? {text:i,type:"text",done:false,selected:"",notes:"",locked:true}
        : {...i, done:i.done||false, selected:i.selected||"", notes:i.notes||"", locked:i.locked!==false}) };
      // ✅ 確保 name-picker 項目永遠存在
      if (!cache[ds].items.find(i => i.type === 'name-picker')) {
        const np = DEFAULTS.find(i => i.type === 'name-picker');
        if (np) cache[ds].items.push({...np, done:false, selected:'', notes:''});
      }
    }
  }
  const today2 = new Date();
  for (let i = 0; i < 90; i++) {
    const d = new Date(today2); d.setDate(d.getDate() - i);
    const ds = dk(d);
    if (!cache[ds]) cache[ds] = { items: getTemplate().map(i => ({...i, done:false, selected:i.selected||"", notes:""})) };
  }
  ensureTodayNamePickerSelected(dk(new Date()));
  renderHeatmap();
  renderStreak();
}

function setStatus(online) {
  document.getElementById('statusDot').className = 'status-dot ' + (online ? 'online' : 'offline');
}

function render() {
  const key = dk(currentDate);
  const day = cache[key];
  if (!day) return;
  ensureTodayNamePickerSelected(dk(currentDate));
  const items = day.items;
  const total = items.length, completed = items.filter(i => i.done).length;
  const rate = total ? Math.round(completed/total*100) : 0;
  const isToday = dk(currentDate) === dk(new Date());
  document.getElementById('dateLabel').textContent = `${currentDate.getFullYear()}/${currentDate.getMonth()+1}/${currentDate.getDate()}`;
  document.getElementById('weekdayLabel').textContent = `週${['日','一','二','三','四','五','六'][currentDate.getDay()]}`;
  document.getElementById('todayBtn').style.display = dk(currentDate) === today() ? 'none' : '';
  document.getElementById('doneCount').textContent = completed;
  document.getElementById('totalCount').textContent = total;
  // Calculate days running from _startDate
  if (typeof startDate !== 'undefined' && startDate) {
    const s = new Date(startDate);
    const now = new Date();
    const days = Math.max(1, Math.floor((now - s) / (86400000)) + 1);
    document.getElementById('daysCount').textContent = days;
    document.getElementById('startDateLabel').textContent = '自 ' + startDate + ' 起';
  } else {
    document.getElementById('daysCount').textContent = '—';
  }
  document.getElementById('progressPct').textContent = rate + '%';
  document.getElementById('progressFill').style.width = rate + '%';
  const list = document.getElementById('checklist');
  list.className = 'checklist' + (editMode ? ' edit-mode' : '');
  list.innerHTML = '';
  items.forEach((item, i) => {
    const text = item.text, done = item.done, notes = item.notes || '';
    const locked = item.locked !== false;
    const div = document.createElement('div');
    const ro = !isToday || dk(currentDate) < today();
    const glColors = ['gl','gl1','gl2','gl3','gl4','gl5','gl6'];
    div.className = 'check-item ' + glColors[i % glColors.length] + (done ? ' done' : '') + (notes ? ' has-note' : '') + (ro ? ' readonly' : '');
    let extraHTML = '';
    if (item.type === 'name-picker') {
      const names = item.selected ? item.selected.split(',').filter(Boolean) : [];
      const todayName = names[0] || '';
      const isCared = done;
      if (isCared) div.className += ' cared';
      if (!ro) div.className += ' name-picker-item';
      if (careCount > 1 || names.length > 1) {
        extraHTML = `<span class="item-text">👤 ${esc(text)}</span>` +
          `<div style="display:flex;flex-wrap:wrap;gap:4px;flex:1;align-items:center;">` +
          names.map(s => `<span style="background:linear-gradient(135deg,#6c5ce7,#a855f7);color:white;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;">${esc(s)}</span>`).join('') +
          (names.length ? '' : `<span style="color:#555;font-size:12px;">未選</span>`) +
          `</div>`;
      } else {
        const todayName = names[0] || '?';
        // ❤️ when done, 🤍 when not
        const cared = done;
        extraHTML = `<span class="item-text">👤 ${esc(text)} <strong>${esc(todayName)}</strong> <span class="care-heart-display">${cared ? '❤️' : '🤍'}</span></span>` +
          `<span class="care-status" style="font-size:11px;color:${cared ? '#f472b6' : '#555'};margin-left:4px;">${cared ? '已關心' : ''}</span>`;
      }
      var nhExtra = '<div class="note-history" id="noteHistory' + i + '"></div>';
    } else {
      extraHTML = `<span class="item-text">${esc(text)}</span>`;
      var nhExtra = '';
    }
    div.innerHTML =
      `<div class="item-body">` +
        `<span class="item-num">${i+1}</span><div class="cb">✓</div>${extraHTML}` +
        `<button class="lock-btn" data-idx="${i}">${locked?'🔒':'🔓'}</button>` +
        `<button class="drag-handle" data-idx="${i}">⠿</button>` +
        `<button class="edit-btn" data-idx="${i}">✏️</button>` +
        `<button class="del-btn" data-idx="${i}">✕</button>` +
        `${i > 0 ? `<button class="note-btn" data-idx="${i}">📝</button>` : ''}` +
      `</div>` +
      `<div class="note-area" id="noteArea${i}" data-idx="${i}">${nhExtra}<textarea data-idx="${i}" placeholder="寫備註...">${esc(notes)}</textarea><button class="note-close-btn" data-idx="${i}">▲</button></div>`;
    if (!ro) {
      div.querySelector('.cb').onclick = (e) => { if (editMode) return; toggle(i); };
      if (item.type !== 'name-picker') {
        div.querySelector('.item-text').onclick = (e) => { if (editMode) return; toggle(i); };
      } else {
        // Click on name-picker item: toggles done (checkmark) + care heart together
        div.querySelector('.item-text').onclick = (e) => {
          if (editMode) return;
          e.stopPropagation();
          toggle(i);
          render();
        };
      }
      const selEl = div.querySelector('.name-select');
      if (selEl) selEl.onchange = function() {
        item.selected = this.value;
        updateCareDates(this.value);
        const s = div.querySelector('.item-selected');
        if (s) s.textContent = this.value || '未選';
        scheduleSave();
      };
      const noteBtnEl = div.querySelector('.note-btn');
      if (noteBtnEl) noteBtnEl.onclick = (e) => {
        e.stopPropagation();
        const a=document.getElementById('noteArea'+i); a.classList.toggle('open');
        const hDiv = document.getElementById('noteHistory' + i);
        if (hDiv) {
          const h = getHistoryNotes(i);
          hDiv.innerHTML = !h.length ? '<div class="nh-empty">前兩天無記錄</div>'
            : h.map(x => '<div class="nh-item"><span class="nh-date">' + esc(x.date) + '</span>'
              + (x.selected ? '<span class="nh-person">👤' + esc(x.selected) + '</span>' : '')
              + '<span class="nh-text">' + esc(x.notes) + '</span></div>').join('');
        }
        a.querySelector('textarea').focus();
      };
    }
    div.querySelector('.lock-btn').onclick = e => { e.stopPropagation(); toggleLock(i); };
    if (ro) {
      div.querySelector('.edit-btn').style.display = 'none';
      div.querySelector('.lock-btn').style.display = 'none';
    }
    div.querySelector('.edit-btn').onclick = e => {
      e.stopPropagation();
      const d=cache[dk(currentDate)]; if(!d||!d.items[i]) return;
      const item=d.items[i];
      if (item.locked && !editMode) return;
      const textSpan = div.querySelector('.item-text');
      if (!textSpan || textSpan.tagName==='INPUT') return;
      const isNp = item.type === 'name-picker';
      const inp = document.createElement('input');
      inp.type='text'; inp.className='item-text-input'; inp.value=isNp ? item.text : item.text;
      inp.maxLength=60;
      textSpan.replaceWith(inp);
      inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
      const save = () => {
        const v = inp.value.trim();
        if (v && v !== item.text) { item.text = v; scheduleSave(); }
        const span = document.createElement('span');
        span.className = 'item-text' + (isNp ? ' name-picker' : '');
        span.textContent = isNp ? '👤 ' + (v||item.text) : (v||item.text);
        inp.replaceWith(span);
        if (!isNp) span.onclick = () => toggle(i);
      };
      inp.onblur = save;
      inp.onkeydown = e2 => { if (e2.key==='Enter') { e2.preventDefault(); inp.blur(); } };
    };
    div.querySelector('.del-btn').onclick = e => {
      e.stopPropagation();
      if (!confirm(`刪除「${text}」？`)) return;
      // 🔴 不能用 render 當下捕捉的 i：前面有項目被刪掉過，i 就過期了 → 會刪到別筆（重整就看到它回來）
      //    一律用「這一刻 DOM 上的位置」當索引
      const _list = document.getElementById('checklist');
      const _cur = _list ? [..._list.querySelectorAll('.check-item')].indexOf(div) : i;
      del(_cur >= 0 ? _cur : i);
    };
    div.querySelectorAll('.move-btn').forEach(btn => {
      btn.onclick = e => { e.stopPropagation(); moveItem(parseInt(btn.dataset.idx), parseInt(btn.dataset.dir)); };
    });
    list.appendChild(div);
  });
  document.querySelectorAll('.note-area textarea').forEach(ta => {
    ta.oninput = () => { const idx=parseInt(ta.dataset.idx); const d=cache[dk(currentDate)]; if (d && d.items[idx]) d.items[idx].notes=ta.value; scheduleSave(); };
  });
  document.querySelectorAll('.note-close-btn').forEach(btn => {
    btn.onclick = () => { document.getElementById('noteArea'+btn.dataset.idx).classList.remove('open'); };
  });
  setupDragHandles();
  // === Care Overview toggle (below last name-picker item) ===
  const toggleWrap = document.getElementById('careToggleWrap');
  if (toggleWrap) {
    const lastNpIdx = [...items].reverse().findIndex(it => it.type === 'name-picker');
    if (lastNpIdx !== -1) {
      const isOpen = localStorage.getItem('careOverviewOpen') === 'true';
      toggleWrap.style.display = '';
      document.getElementById('careToggleBtn').className = 'care-toggle' + (isOpen ? ' open' : '');
      document.getElementById('careOverview').className = 'care-overview' + (isOpen ? ' open' : '');
      if (isOpen) renderCareOverview();
    } else {
      toggleWrap.style.display = 'none';
    }
  }
  // Restore open notes and editing text after rebuild
  if (typeof _openNotes !== 'undefined') {
    for (const idx of Object.keys(_openNotes)) {
      const a = document.getElementById('noteArea' + idx);
      if (a) a.classList.add('open');
    }
  }
  if (typeof _editingText !== 'undefined') {
    for (const [idx, val] of Object.entries(_editingText)) {
      const inp = document.querySelector('.item-text-input[data-idx="' + idx + '"]');
      if (inp) inp.value = val;
    }
  }
}

// === Realtime Sync ===
let syncUnsub = null;
function startRealtimeSync() {
  if (syncUnsub) syncUnsub();
  const ref = doc(db, "dashboard", boardKey);
  let ready = false;
  let lastRenderKey = '';
  setTimeout(() => { ready = true; }, 1000);

      <input type="date" id="startDateInput" style="width:100%;background:#0f0f13;border:1px solid #282838;border-radius:6px;padding:6px 8px;color:#e8e8ed;font-size:13px;outline:none;margin-top:4px;">
    </div>
    <div class="btn-row">
      <button id="closeNameDialog" class="close-btn">關閉</button>
      <button id="saveNameList" class="save-btn">💾 儲存設定</button>
    </div>
  </div>
</div>`;

function showNameDialog() {
  const existing = document.getElementById('nameDialog');
  if (existing) { existing.style.display = 'flex'; renderNameList(); populateCareInputs(); return; }
  document.body.insertAdjacentHTML('beforeend', dialogHTML);
  const dialog = document.getElementById('nameDialog');
  dialog.style.display = 'flex';
  document.getElementById('closeNameDialog').onclick = () => { dialog.style.display = 'none'; };
  document.getElementById('addNameBtn').onclick = () => {
    const inp = document.getElementById('newNameInput');
    const n = inp.value.trim(); if (!n) return;
    nameList.push(n); inp.value = ''; renderNameList();
  };
  document.getElementById('newNameInput').onkeydown = e => {
    if (e.key === 'Enter') document.getElementById('addNameBtn').click();
  };
  document.getElementById('saveNameList').onclick = async () => {
    careEvery = parseInt(document.getElementById('careEveryInput').value) || 1;
    careCount = parseInt(document.getElementById('careCountInput').value) || 1;
    careInterval = parseInt(document.getElementById('careIntervalInput').value) || 7;
    const sdInput = document.getElementById('startDateInput').value;
    const newStartDate = sdInput || today();
    startDate = newStartDate;
    const ref = doc(db, "dashboard", boardKey);
    try { await setDoc(ref, { _names: nameList.length ? nameList : DEFAULT_NAMES, _careEvery: careEvery, _careCount: careCount, _careInterval: careInterval, _careDates: careDates, _startDate: startDate }, { merge: true }); setStatus(true); } catch(e) { setStatus(false); }
    // Re-render to apply new rotation and label
    render();
    dialog.style.display = 'none';
  };
  populateCareInputs();
  renderNameList();
}
function populateCareInputs() {
  const e = document.getElementById('careEveryInput');
  if (e) e.value = careEvery;
  const c = document.getElementById('careCountInput');
  if (c) c.value = careCount;
  const i = document.getElementById('careIntervalInput');
  if (i) i.value = careInterval;
  const sd = document.getElementById('startDateInput');
  if (sd) sd.value = startDate || '';
}

function renderNameList() {
  const container = document.getElementById('nameListContainer');
  if (!container) return;
  container.innerHTML = nameList.map((n, i) => {
    const initial = n.charAt(0);
    return `<div class="name-item">
      <span class="name-index">${i + 1}</span>
      <div class="name-avatar">${esc(initial)}</div>
      <span class="name-text" data-idx="${i}">${esc(n)}</span>
      <button class="del-name-btn" data-idx="${i}">✕</button>
    </div>`;
  }).join('');
  container.querySelectorAll('.name-text').forEach(span => {
    span.onclick = () => {
      const idx = parseInt(span.dataset.idx);
      const inp = document.createElement('input');
      inp.type = 'text'; inp.value = nameList[idx];
      inp.style.cssText = 'flex:1;font-size:14px;background:#0f0f13;border:1px solid #6c5ce7;border-radius:4px;padding:4px 8px;color:#e8e8ed;outline:none;font-family:inherit;';
      inp.maxLength = 20;
      span.replaceWith(inp);
      inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
      const save = () => {
        const v = inp.value.trim();
        if (v && v !== nameList[idx]) nameList[idx] = v;
        renderNameList();
      };
      inp.onblur = save;
      inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); inp.blur(); } };
    };
  });
  container.querySelectorAll('.del-name-btn').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.idx);
      nameList.splice(idx, 1);
      renderNameList();
    };
  });
}

// === Calendar popup ===
let calMonth, calYear;
function renderCalendar() {
  if (calMonth === undefined) { calMonth = currentDate.getMonth(); calYear = currentDate.getFullYear(); }
  document.getElementById('calMoy').textContent = calYear + '/' + String(calMonth+1).padStart(2,'0');
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '<div class="cal-dow">日</div><div class="cal-dow">一</div><div class="cal-dow">二</div><div class="cal-dow">三</div><div class="cal-dow">四</div><div class="cal-dow">五</div><div class="cal-dow">六</div>';
  const first = new Date(calYear, calMonth, 1).getDay();
  const days = new Date(calYear, calMonth + 1, 0).getDate();
  const today = new Date();
  const td = today.getFullYear()===calYear && today.getMonth()===calMonth ? today.getDate() : 0;
  const cd = currentDate.getFullYear()===calYear && currentDate.getMonth()===calMonth ? currentDate.getDate() : 0;
  for (let i=0; i<first; i++) grid.innerHTML += '<div class="cal-day other"></div>';
  const launchTs = new Date(startDate || today()).getTime();
  for (let d=1; d<=days; d++) {
    let cls = 'cal-day';
    const dts = new Date(calYear, calMonth, d).getTime();
    const beforeLaunch = dts < launchTs;
    if (beforeLaunch) cls += ' other disabled';
    if (d === td) cls += ' today';
    if (d === cd) cls += ' selected';
    // Mark launch day
    const launchDate = startDate || today();
    const [ly,lm,ld] = launchDate.split('-').map(Number);
    const isLaunch = calYear===ly && calMonth===(lm-1) && d===ld;
    grid.innerHTML += `<div class="${cls}" data-day="${d}"${beforeLaunch?'':' data-selectable="1"'}>${isLaunch ? '🎉' : d}</div>`;
  }
}
document.getElementById('dateLabel').onclick = () => {
  calMonth = currentDate.getMonth(); calYear = currentDate.getFullYear();
  renderCalendar();
  document.getElementById('calOverlay').classList.add('open');
};
document.getElementById('calOverlay').onclick = e => { if (e.target === e.currentTarget) document.getElementById('calOverlay').classList.remove('open'); };
document.getElementById('calClose').onclick = () => document.getElementById('calOverlay').classList.remove('open');
document.getElementById('calPrevM').onclick = () => { calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); };
document.getElementById('calNextM').onclick = () => { calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar(); };
document.getElementById('calGrid').onclick = e => {
  const day = e.target.dataset.day;
  if (!day) return;
  if (!e.target.dataset.selectable) return;
  document.getElementById('calOverlay').classList.remove('open');
  if (dirtyToday) saveCurrentDay();
  currentDate.setFullYear(calYear, calMonth, parseInt(day));
  render();
};

// === Events ===
document.getElementById('loginBtn').onclick = () => doLogin();
document.getElementById('loginKey').onkeydown = e => { if (e.key==='Enter') doLogin(); };
async function doLogin() {
  const input = document.getElementById('loginKey').value.trim().toLowerCase();
  if (!input) return;
  const key = DISPLAY_TO_KEY[input] || input;   // 輸入「好習慣」→ 對應 alan 板
  boardKey = key;
  localStorage.setItem('dashboard_key', boardKey);
  document.getElementById('boardName').textContent = (BOARD_DISPLAY[key] || key) + ' 的儀表板';
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  await loadDay(boardKey, dk(currentDate));
  preloadRecent(boardKey);
  startRealtimeSync();
}

// 只有「本機真的有未寫入的變更」才需要存；沒有的話寫入只是把舊清單再送一次（會蓋掉別人的刪除）
document.getElementById('prevDay').onclick = () => { if (dirtyToday) saveCurrentDay(); currentDate.setDate(currentDate.getDate()-1); const ds=dk(currentDate); if(!cache[ds]){cache[ds]={items:getTemplate().map(i=>({...i,done:false,selected:i.selected||"",notes:""}))};} render(); };
document.getElementById('nextDay').onclick = () => { if (dirtyToday) saveCurrentDay(); currentDate.setDate(currentDate.getDate()+1); const ds=dk(currentDate); if(!cache[ds]){cache[ds]={items:getTemplate().map(i=>({...i,done:false,selected:i.selected||"",notes:""}))};} render(); };
document.getElementById('todayBtn').onclick = () => { currentDate=new Date(); render(); };
document.getElementById('addBtn').onclick = () => { const i=document.getElementById('newItemInput'); addItem(i.value); i.value=''; };
document.getElementById('newItemInput').onkeydown = e => { if (e.key==='Enter') { addItem(e.target.value); e.target.value=''; } };
document.getElementById('nameListBtn').onclick = showNameDialog;
document.getElementById('careToggleBtn').onclick = () => {
  const btn = document.getElementById('careToggleBtn');
  const ov = document.getElementById('careOverview');
  const open = btn.classList.toggle('open');
  ov.classList.toggle('open');
  localStorage.setItem('careOverviewOpen', open);
  if (open) renderCareOverview();
};
document.getElementById('editToggle').onclick = () => {
  editMode = !editMode;
  document.getElementById('editToggle').textContent = editMode ? '✅完成編輯' : '✏️編輯項目';
  document.getElementById('editToggle').className = 'edit-toggle' + (editMode ? ' active' : '');
  render();
  if (editMode) {
    // Scroll checklist container to center of viewport
    const wrap = document.querySelector('.checklist-wrap') || document.querySelector('.checklist');
    if (wrap) {
      const top = wrap.getBoundingClientRect().top + window.pageYOffset;
      const vh = window.innerHeight;
      window.scrollTo({ top: top - vh * 0.25, behavior: 'smooth' });
    }
  }
};
document.getElementById('resetBtn').onclick = () => {
  if (!confirm('重置今天的資料？')) return;
  const ds=dk(currentDate); cache[ds]={items:getTemplate().map(i=>({...i,done:false,selected:i.selected||"",notes:""}))}; render();
  if (boardKey) flushSave();
};
document.getElementById('saveTemplateBtn').onclick = () => {
  saveTemplate();
  alert('✅ 已將目前項目存為內定範本\n新日期會以此為準，其他人開新板也會繼承。');
};
document.getElementById('logoutBtn').onclick = () => { signOut(auth).catch(() => {}); localStorage.removeItem('dashboard_key'); boardKey=''; document.getElementById('mainApp').style.display='none'; document.getElementById('loginScreen').style.display='flex'; document.getElementById('loginKey').value=''; };
// 切到背景時把「還沒寫入的變更」補寫；沒有變更就不要寫（否則只是拿舊清單去蓋伺服器）
document.addEventListener('visibilitychange', () => { if (document.hidden && boardKey && dirtyToday) saveCurrentDay(); });

// === 登入（Google）：dashboard 只有本人 uid 能讀寫（firestore 規則限制）===
const auth = getAuth(app);
const googleProvider = new GoogleAuthProvider();
const POPUP_FALLBACK = ['auth/popup-blocked', 'auth/popup-closed-by-user', 'auth/cancelled-popup-request',
  'auth/operation-not-supported-in-this-environment', 'auth/web-storage-unsupported', 'auth/popup-timeout'];
let appStarted = false;

async function enterApp() {
  if (appStarted) return;
  appStarted = true;
  const boot = document.getElementById('bootSplash');
  if (boot) boot.style.display = 'none';
  const key = boardKey || MASTER_BOARD;
  boardKey = key;
  localStorage.setItem('dashboard_key', key);
  document.getElementById('boardName').textContent = (BOARD_DISPLAY[key] || key) + ' 的儀表板';
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  await loadDay(boardKey, dk(currentDate));
  preloadRecent(boardKey);
  startRealtimeSync();
}

document.getElementById('loginGoogleBtn').onclick = async () => {
  const hint = document.getElementById('loginHint');
  hint.textContent = '登入中…';
  try {
    await signInWithPopup(auth, googleProvider);
    hint.textContent = '登入後即載入你的習慣儀表板';
    return;
  } catch (e) {
    const c = (e && e.code) || String(e);
    if (POPUP_FALLBACK.includes(c)) {
      try { await signInWithRedirect(auth, googleProvider); return; } catch (e2) { alert('登入失敗：' + ((e2 && e2.code) || e2)); }
    }
    alert('登入失敗：' + c);
  }
  hint.textContent = '登入後即載入你的習慣儀表板';
};

getRedirectResult(auth).catch(() => {});
onAuthStateChanged(auth, user => {
  if (user) {
    enterApp();
  } else {
    appStarted = false;
    const boot = document.getElementById('bootSplash');
    if (boot) boot.style.display = 'none';
    document.getElementById('mainApp').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
  }
});
// 保險：15 秒內都沒收到登入狀態（SDK 卡住／離線）就直接顯示登入畫面，不要一直卡在載入中
setTimeout(() => {
  if (appStarted) return;
  const boot = document.getElementById('bootSplash');
  if (boot) boot.style.display = 'none';
  const ls = document.getElementById('loginScreen');
  if (ls) ls.style.display = 'flex';
}, 15000);
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// 強制更新：清掉 Service Worker 與所有快取後重載（手機拿到舊版時用這個）
document.addEventListener('DOMContentLoaded', () => {
  const fu = document.getElementById('forceUpdate');
  if (!fu) return;
  fu.addEventListener('click', async e => {
    e.preventDefault();
    fu.textContent = '更新中…';
    try {
      if ('serviceWorker' in navigator) {
        const rs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(rs.map(r => r.unregister()));
      }
      if (window.caches) {
        const ks = await caches.keys();
        await Promise.all(ks.map(k => caches.delete(k)));
      }
    } catch (err) {}
    location.replace(location.pathname + '?u=' + Date.now());
  });
});

// 個人平台整合：開關全螢幕 iframe
document.addEventListener('DOMContentLoaded', () => {
  const openBtn = document.getElementById('ppOpenBtn');
  const overlay = document.getElementById('ppOverlay');
  const frame = overlay ? overlay.querySelector('iframe') : null;

  if (openBtn) openBtn.addEventListener('click', () => {
    if (frame) frame.src = frame.src; // 重載最新
    overlay.style.display = 'block';
  });
});
</script>
